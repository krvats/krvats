<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170f22"/>
      <stop offset="55%" stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#e0a83f" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e0a83f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#6d4fa0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d4fa0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- stars -->
  <g fill="#ece8f0">
    <circle cx="92" cy="48" r="1.3" opacity="0.7"/>
    <circle cx="150" cy="110" r="1" opacity="0.5"/>
    <circle cx="70" cy="180" r="1.6" opacity="0.6"/>
    <circle cx="200" cy="60" r="1" opacity="0.4"/>
    <circle cx="1080" cy="70" r="1.4" opacity="0.6"/>
    <circle cx="1140" cy="150" r="1" opacity="0.5"/>
    <circle cx="1020" cy="220" r="1.6" opacity="0.5"/>
    <circle cx="980" cy="55" r="1" opacity="0.4"/>
    <circle cx="1150" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="40" cy="240" r="1.1" opacity="0.5"/>
  </g>

  <!-- faint orbit arc, echoes the video backdrops -->
  <ellipse cx="1000" cy="150" rx="260" ry="130" fill="none" stroke="#e0a83f" stroke-opacity="0.15" stroke-width="1"/>

  <!-- large faint pi, subtle texture not a loud logo -->
  <text x="1020" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="220" fill="#e0a83f" opacity="0.07">&#960;</text>

  <!-- title -->
  <text x="90" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#ece8f0" font-weight="500">Priyanshu Kumar</text>
  <text x="91" y="178" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#9793a8" letter-spacing="0.5">number theory &#183; independent research &#183; Kira Kira</text>

  <!-- accent rule -->
  <rect x="91" y="196" width="64" height="2" fill="#e0a83f"/>

  <text x="91" y="228" font-family="Courier New, monospace" font-size="13" fill="#e0a83f" opacity="0.85">doi.org/10.5281/zenodo.22715269</text>
</svg>
